spring:
  application:
    name: moasem-backend
  profiles:
    active: local
  config:
    import: "optional:file:.env[.properties]"
  jpa:
    properties:
      hibernate:
        # Kotlin data class와 java.time 타입을 JSONB로 매핑하기 위한 커스텀 FormatMapper
        type.json_format_mapper: com.moasem.backend.global.config.KotlinJsonFormatMapper

moasem:
  oauth2:
    google:
      client-id: ${GOOGLE_CLIENT_ID}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 1209600000
  ai:
    gemini:
      # 키는 여기 두지 않는다. 환경변수 GEMINI_API_KEY로만 들어온다.
      # 비어 있으면 어댑터가 등록되지 않고 스텁이 대신 쓰인다.
      api-key: ${GEMINI_API_KEY:}
      model: gemini-3.5-flash-lite
  s3:
    # 자격증명은 여기 두지 않는다. AWS SDK 기본 제공자 체인이 찾는다
    # (EC2는 IAM 역할, 로컬은 AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY 환경변수).
    bucket: ${S3_BUCKET:moasem-backend-storage}
    region: ${AWS_REGION:ap-northeast-2}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

# 배포 헬스 체크용. SecurityConfig 작성 시 /actuator/health 는 permitAll 로 열어둘 것.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/moasem
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

logging:
  level:
    com.moasem: debug

# 로컬에는 S3가 없어 보고서 파일을 디스크에 두고 앱이 직접 서빙한다.
# build/ 아래라 gradlew clean 시 함께 지워진다.
moasem:
  local-storage:
    dir: build/local-report-files
    base-url: http://localhost:8080

  # 아래 두 값은 로컬 전용 기본값이다. 받아서 바로 실행할 수 있도록 둔다.
  #
  # 기본값을 최상단이 아니라 이 블록에 두는 이유는, 최상단에 두면 운영에서도
  # 같은 값이 쓰이기 때문이다. 저장소에 공개된 문자열로 토큰에 서명하게 되고
  # 아무도 눈치채지 못한다. 운영은 그대로 환경변수를 요구해, 값이 없으면
  # 조용히 잘못된 값으로 뜨는 대신 기동 단계에서 실패한다.
  jwt:
    secret: local-dev-only-secret-do-not-use-in-production-32bytes
  oauth2:
    google:
      # 기동에는 값의 내용이 필요 없고, 존재만 하면 된다. 실제 검증은 구글 로그인
      # 요청이 들어올 때만 일어난다. 그 흐름을 직접 확인할 사람만 환경변수로 덮어쓴다.
      client-id: ${GOOGLE_CLIENT_ID:local-dev-dummy-client-id}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

logging:
  level:
    com.moasem: info
